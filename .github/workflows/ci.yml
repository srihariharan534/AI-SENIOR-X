name: AI-SENIOR-X CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Build & Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov pytest-mock aiosqlite
          pip install -e ".[dev]"

      - name: Run Ruff Linter & Format Check
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Backend Test Suite (136 Tests)
        env:
          ENVIRONMENT: testing
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-secret-key-for-continuous-integration-32b
        run: |
          python -m pytest backend/tests -v
